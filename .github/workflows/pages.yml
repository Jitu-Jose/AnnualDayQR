name: Validate Apps Script native-camera staging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check:secrets
      - run: npm test
      - name: Parse selected Apps Script source
        run: node --check < native-staging/src/Native.gs
# No camera build/browser launch, Pages artifact, Apps Script upload or deployment.
